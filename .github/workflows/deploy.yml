name: Deploy Web

# WS-B stub: prove every master push produces a buildable apps/web image.
# The actual deploy lands in WS-A (launch-program D1: Railway).

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  docker-build:
    name: Build apps/web image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f apps/web/Dockerfile -t superapp-web:${{ github.sha }} .

      # WS-A (2026-08): deploys are Railway-native (GitHub auto-deploy per
      # service, gated by 'Wait for CI'). This job remains as the image-build
      # gate only: master must always docker-build cleanly on a neutral runner.
