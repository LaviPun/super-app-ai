name: cron

# WS-A Task 10, demoted to FALLBACK 2026-09: GitHub's scheduled workflows are
# best-effort and this one actually fired every 2-5 HOURS (21 runs in 3 days),
# not every 5 minutes — see docs/debug.md §28 / issue #51. The schedule is
# now driven by the worker service's in-process scheduler
# (apps/web/scripts/worker.ts -> services/jobs/cron-scheduler.server.ts);
# /api/cron shares its Redis tick lock, so a run here that lands mid-tick gets
# 200 { skipped: "locked" } and still pings the dead-man's switch. Kept for:
# the healthchecks.io liveness signal on the web service, and a manual
# workflow_dispatch trigger. Requires repo secrets CRON_SECRET, CRON_BASE_URL,
# HEALTHCHECKS_PING_URL (owner-provisioned; see docs/runbooks/postgres-migration.md).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fire /api/cron
        run: |
          curl --fail-with-body -sS --max-time 60 \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_BASE_URL }}/api/cron"
      - name: Dead-man's switch ping
        if: success()
        run: curl -fsS --max-time 10 "${{ secrets.HEALTHCHECKS_PING_URL }}"
